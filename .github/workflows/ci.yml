name: CI

on:
  pull_request:
  push:
    branches: [master, 'release/**']

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-pack:
    name: Build, Test, Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history

      - name: Validate publication channel
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -eq 'refs/heads/master') {
            if ($version -notmatch '-') {
              throw 'The master branch must declare a prerelease version.'
            }
          } elseif ($env:GITHUB_REF -match '^refs/heads/release/v(?<series>\d+\.\d+)$') {
            $series = $Matches.series
            if ($version -match '-') {
              throw 'Release branches require a committed stable version.'
            }
            if ($version -notmatch '^(?<series>\d+\.\d+)(?:\.\d+)?$' -or $Matches.series -ne $series) {
              throw "Branch $env:GITHUB_REF must declare a stable $series version."
            }
          } else {
            throw "Unsupported publication branch: $env:GITHUB_REF"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$packages = Get-Content src/Directory.Packages.props -Raw
          $toolVersion = $packages.SelectSingleNode('//PackageVersion[@Include="Nerdbank.GitVersioning"]').Version
          $toolPath = Join-Path $env:RUNNER_TEMP 'nbgv'
          dotnet tool install nbgv --version $toolVersion --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & (Join-Path $toolPath 'nbgv') get-version -v NuGetPackageVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/TenantCloud.slnx --force

      - name: Build
        run: dotnet build src/TenantCloud.slnx -c Release -warnaserror --no-restore

      - name: Test
        run: >-
          dotnet test --solution src/TenantCloud.slnx
          -c Release
          --no-build
          --results-directory TestResults
          --
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          $coberturaFiles = Get-ChildItem -Path TestResults -Filter '*.cobertura.xml' -Recurse -ErrorAction SilentlyContinue
          if (-not $coberturaFiles -or $coberturaFiles.Count -eq 0) {
            Write-Host 'No Cobertura coverage files found — skipping summary.'
            exit 0
          }
          foreach ($file in $coberturaFiles) {
            [xml]$xml = Get-Content $file.FullName
            $lineRate = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
            $branchRate = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
            "## Code Coverage`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| Metric | Value |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "|--------|-------|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| Line coverage | ${lineRate}% |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| Branch coverage | ${branchRate}% |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Write-Host "Line coverage: ${lineRate}%, Branch coverage: ${branchRate}%"
          }

      - name: Pack
        run: dotnet pack src/TenantCloud.slnx -c Release --no-restore -o ${{ runner.temp }}/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.nupkg
          retention-days: 14

  test-dotnet-tool:
    name: Test .NET Tool (${{ matrix.os }})
    needs: build-test-pack
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts/packages

      - name: Test installed and one-shot Tool
        env:
          TENANTCLOUD_TOOL_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/packages
          TENANTCLOUD_TOOL_PACKAGE_VERSION: ${{ needs.build-test-pack.outputs.version }}
        run: >-
          dotnet test
          --project src/Yllibed.TenantCloudClient.Tool.Tests/Yllibed.TenantCloudClient.Tool.Tests.csproj
          -c Release
          --
          --report-trx
          --results-directory TestResults/dotnet-tool

  publish-binaries:
    name: Publish Binaries
    needs: build-test-pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: ${{ github.event_name == 'push' && fromJson('["any","win-x64","win-arm64","osx-x64","osx-arm64","linux-x64","linux-arm64"]') || fromJson('["any","win-x64"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Publish for ${{ matrix.rid }}
        if: matrix.rid != 'any'
        run: >-
          dotnet publish
          src/Yllibed.TenantCloudClient.Mcp/Yllibed.TenantCloudClient.Mcp.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}

      - name: Publish portable
        if: matrix.rid == 'any'
        run: >-
          dotnet publish
          src/Yllibed.TenantCloudClient.Mcp/Yllibed.TenantCloudClient.Mcp.csproj
          -c Release
          -p:SelfContained=false
          -p:PublishSelfContained=false
          -p:UseAppHost=false
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -o publish/any

      - name: Package binary
        shell: bash
        run: |
          mkdir -p archives
          archive="$PWD/archives/tenantcloud-${{ matrix.rid }}.zip"
          (cd "publish/${{ matrix.rid }}" && zip -r "$archive" . -x '*.pdb' '*.xml')

      - name: Smoke test portable archive
        if: matrix.rid == 'any'
        shell: bash
        run: |
          extracted=$(mktemp -d)
          unzip archives/tenantcloud-any.zip -d "$extracted"
          cd "$extracted"
          dotnet tenantcloud.dll --help

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tenantcloud-${{ matrix.rid }}
          path: archives/tenantcloud-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    needs: [build-test-pack, test-dotnet-tool, publish-binaries]
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: artifacts/packages

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tenantcloud-*
          path: artifacts/binaries
          merge-multiple: false

      - name: Validate package versions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build-test-pack.outputs.version }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -eq 0) { throw 'No NuGet packages were downloaded.' }
          foreach ($package in $packages) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $spec = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
              if ($spec.Count -ne 1) { throw "Expected one nuspec in $($package.Name)." }
              $reader = [System.IO.StreamReader]::new($spec[0].Open())
              try { [xml]$metadata = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($metadata.package.metadata.version -ne $env:RELEASE_VERSION) {
                throw "Package version mismatch in $($package.Name)."
              }
            } finally { $archive.Dispose() }
          }

      - name: Validate existing release provenance
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build-test-pack.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tagRefs.Count -gt 0) {
            $peeled = @($tagRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled.Count -gt 0 ? $peeled[0] : $tagRefs[0]) -split '\s+')[0]
            if ($tagSha -ne $env:RELEASE_SHA) {
              throw "Tag $tag points to $tagSha instead of $env:RELEASE_SHA. Publish a new version."
            }
          }

          $client = [System.Net.Http.HttpClient]::new()
          try {
            foreach ($package in Get-ChildItem artifacts/packages/*.nupkg) {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
              try {
                $entry = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })[0]
                $reader = [System.IO.StreamReader]::new($entry.Open())
                try { [xml]$localSpec = $reader.ReadToEnd() } finally { $reader.Dispose() }
              } finally { $archive.Dispose() }

              $id = [string]$localSpec.package.metadata.id
              $lowerId = $id.ToLowerInvariant()
              $lowerVersion = $env:RELEASE_VERSION.ToLowerInvariant()
              $uri = "https://api.nuget.org/v3-flatcontainer/$lowerId/$lowerVersion/$lowerId.nuspec"
              $response = $client.GetAsync($uri).GetAwaiter().GetResult()
              try {
                if ($response.StatusCode -eq [System.Net.HttpStatusCode]::NotFound) { continue }
                [void]$response.EnsureSuccessStatusCode()
                [xml]$remoteSpec = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              } finally { $response.Dispose() }

              $publishedSha = [string]$remoteSpec.package.metadata.repository.commit
              if ($publishedSha -ne $env:RELEASE_SHA) {
                throw "$id $env:RELEASE_VERSION is already published from '$publishedSha', not $env:RELEASE_SHA. Publish a new version."
              }
            }
          } finally { $client.Dispose() }

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          assets="$PWD/release-assets"
          cp artifacts/packages/*.nupkg "$assets/"
          cp artifacts/binaries/tenantcloud-*/*.zip "$assets/"
          ls -la "$assets/"

      - name: Authenticate to NuGet
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: carl.debilly

      - name: Publish to NuGet
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build-test-pack.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          gh release create "v$RELEASE_VERSION"
          release-assets/*
          --target "$RELEASE_SHA"
          --title "v$RELEASE_VERSION"
          --generate-notes
          ${{ contains(needs.build-test-pack.outputs.version, '-') && '--prerelease' || '' }}
